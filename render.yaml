services:
  - type: web
    name: planet-rock
    runtime: python
    plan: free
    buildCommand: "true"
    startCommand: "python backend/server.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: DATA_DIR
        value: /var/data
    disk:
      name: planet-rock-data
      mountPath: /var/data
      sizeGB: 1
    domains:
      - thematchbook.org
      - www.thematchbook.org
